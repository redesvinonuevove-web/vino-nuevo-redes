<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vino Nuevo · Redes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* ── Layout: sidebar fijo + panel principal con dashboard de tarjetas muy redondeadas ── */
:root{
  --wine:#7a1427; --wine-2:#9a1b32; --wine-deep:#5c0f1d;
  --wine-soft:rgba(122,20,39,.10); --wine-tint:rgba(122,20,39,.16);
  --gold:#d4af37; --amber:#e6b53c; --gold-soft:rgba(212,175,55,.16);
  --bg:#f1f1f3; --panel:#ffffff; --panel-2:#f7f7f8;
  --fg:#17161a; --muted:#79767e; --faint:#a3a0a8;
  --line:rgba(0,0,0,.07); --line-2:rgba(0,0,0,.12);
  --card-sh:0 1px 2px rgba(0,0,0,.04), 0 14px 40px rgba(0,0,0,.05);
  --blur:saturate(160%) blur(20px);
  --st-pend:#9a8d6a; --st-proc:#0a84ff; --st-rev:#d4af37; --st-apro:#2fa35a; --st-pub:#7a1427;
  --ar-dis:#d4af37; --ar-red:#7a1427; --ar-cop:#c0683a;
  --prio-alta:#d6336c; --prio-media:#d4af37; --prio-baja:#6b8e9a;
  --font:-apple-system,"SF Pro Text","SF Pro Display","Inter",system-ui,sans-serif;
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --sidebar-w:248px;
  --hatch:repeating-linear-gradient(135deg, rgba(0,0,0,.09) 0 2px, transparent 2px 8px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0a0a0c; --panel:#161619; --panel-2:#1e1e22; --fg:#f3f2f5; --muted:#9a97a1; --faint:#6a6771;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --card-sh:0 1px 2px rgba(0,0,0,.5), 0 18px 50px rgba(0,0,0,.5);
  --wine-soft:rgba(154,27,50,.18); --wine-tint:rgba(154,27,50,.26); --gold-soft:rgba(212,175,55,.2);
  --st-apro:#34c56e; --hatch:repeating-linear-gradient(135deg, rgba(255,255,255,.1) 0 2px, transparent 2px 8px);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a0a0c; --panel:#161619; --panel-2:#1e1e22; --fg:#f3f2f5; --muted:#9a97a1; --faint:#6a6771;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --card-sh:0 1px 2px rgba(0,0,0,.5), 0 18px 50px rgba(0,0,0,.5);
  --wine-soft:rgba(154,27,50,.18); --wine-tint:rgba(154,27,50,.26); --gold-soft:rgba(212,175,55,.2);
  --st-apro:#34c56e; --hatch:repeating-linear-gradient(135deg, rgba(255,255,255,.1) 0 2px, transparent 2px 8px);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-.011em;line-height:1.4}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--fg)}
h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance}
[hidden]{display:none!important}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px;border:3px solid transparent;background-clip:padding-box}

/* ── Shell ── */
.app{display:flex;min-height:100%}
.sidebar{width:var(--sidebar-w);flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.logo{width:36px;height:36px;border-radius:11px;flex:none;background:linear-gradient(150deg,var(--wine-2),var(--wine-deep));display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;box-shadow:0 3px 12px rgba(122,20,39,.4)}
.brand .bt{font-weight:800;font-size:17px;letter-spacing:-.03em;line-height:1.05}
.brand .bs{font-size:11px;color:var(--muted);font-weight:600}
.logo-img{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;background:#fff;box-shadow:0 2px 10px rgba(122,20,39,.28);border:1px solid var(--line)}
.side-mark{display:flex;align-items:center;gap:9px;padding:13px 8px 2px;margin-top:4px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);font-weight:600}
.side-mark img{width:20px;height:20px;border-radius:50%;object-fit:cover;background:#fff;flex:none}
.nav-lbl{font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.09em;padding:14px 10px 7px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 11px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);position:relative;transition:.14s;text-align:left;width:100%}
.nav-item svg{width:19px;height:19px;flex:none}
.nav-item:hover{color:var(--fg);background:var(--panel-2)}
.nav-item.active{color:var(--wine);background:var(--wine-soft)}
:root[data-theme="dark"] .nav-item.active,:root:not([data-theme="light"]) .nav-item.active{color:#fff}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .nav-item.active{color:var(--wine)}}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--wine)}
.nav-item .badge{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--gold);color:#2a1f00;border-radius:20px;padding:2px 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:3px}
.promo{margin-top:14px;border-radius:var(--r-lg);padding:16px;color:#fff;background:linear-gradient(155deg,var(--wine-2),var(--wine-deep));position:relative;overflow:hidden}
.promo::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.5),transparent 70%)}
.promo .pt{font-weight:700;font-size:14px;position:relative}
.promo .ps{font-size:11.5px;opacity:.82;margin:5px 0 12px;position:relative}
.promo .pb{position:relative;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px}
.promo .pb svg{width:14px;height:14px}

/* ── Main ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);display:flex;align-items:center;gap:14px;padding:14px max(20px,env(safe-area-inset-right,0px)) 14px 20px}
.hamb{display:none;width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);place-items:center}
.hamb svg{width:20px;height:20px}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;transition:.15s}
.search:focus-within{border-color:var(--line-2)}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.search input{border:none;outline:none;background:none;flex:1;min-width:0;font-size:14px}
.search .kbd{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-weight:600}
.topbar .spacer{flex:1}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;position:relative;transition:.15s;flex:none}
.iconbtn:hover{border-color:var(--line-2)}
.iconbtn svg{width:19px;height:19px}
.dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--wine);border:2px solid var(--panel)}
.who{display:flex;align-items:center;gap:10px;padding:5px 7px 5px 5px;border-radius:30px;background:var(--panel);border:1px solid var(--line);transition:.15s}
.who:hover{border-color:var(--line-2)}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.who .meta{text-align:left;line-height:1.15;min-width:0}
.who .meta .n{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.who .meta .r{font-size:11px;color:var(--muted)}
@media(max-width:520px){.who .meta{display:none}}
.chev{width:15px;height:15px;color:var(--muted);flex:none}

/* ── Content ── */
.content{padding:4px max(22px,env(safe-area-inset-right,0px)) 40px 22px;max-width:1240px;width:100%}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:30px;font-weight:800}
.page-head .sub{color:var(--muted);font-size:14px;margin-top:4px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;transition:.15s;border:1px solid transparent;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn-pri{background:var(--wine);color:#fff;box-shadow:0 4px 16px rgba(122,20,39,.3)}
.btn-pri:hover{background:var(--wine-2)}
.btn-gold{background:linear-gradient(150deg,var(--gold),var(--amber));color:#2a1f00;box-shadow:0 4px 16px rgba(212,175,55,.3)}
.btn-ghost{background:var(--panel);border-color:var(--line);color:var(--fg)}
.btn-ghost:hover{border-color:var(--line-2)}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:11px}
.btn-danger{background:transparent;border-color:var(--wine);color:var(--wine)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--card-sh)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{padding:8px 15px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.15s;display:inline-flex;align-items:center;gap:6px}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--wine);color:#fff}

/* ══ DASHBOARD ══ */
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.stat{padding:20px;border-radius:var(--r-xl);position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--panel)}
.stat.feat{background:linear-gradient(155deg,var(--wine-2),var(--wine-deep));border-color:transparent;color:#fff}
.stat.feat::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.35),transparent 70%)}
.stat .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.stat .sh .lbl{font-size:13.5px;font-weight:600;color:var(--muted)}
.stat.feat .sh .lbl{color:rgba(255,255,255,.85)}
.stat .arrow{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line)}
.stat.feat .arrow{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.2)}
.stat .arrow svg{width:15px;height:15px}
.stat .big{font-size:42px;font-weight:800;line-height:1;margin-top:14px;font-variant-numeric:tabular-nums}
.stat .foot{margin-top:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--muted);padding-top:12px}
.stat.feat .foot{color:rgba(255,255,255,.8)}
.stat .foot .ic{width:18px;height:18px;border-radius:5px;background:var(--panel-2);display:grid;place-items:center}
.stat.feat .foot .ic{background:rgba(255,255,255,.18)}
.stat .foot .ic svg{width:11px;height:11px}

.dash-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.dash-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec-card{padding:22px;border-radius:var(--r-xl)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.sec-head h2{font-size:17px;font-weight:700}
.sec-head .mini-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);padding:6px 12px;border-radius:20px;transition:.15s}
.sec-head .mini-btn:hover{border-color:var(--line-2);color:var(--fg)}
.sec-head .mini-btn svg{width:13px;height:13px}

.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;align-items:end;height:200px;padding-top:24px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:46px;border-radius:30px;position:relative;transition:.5s cubic-bezier(.2,.8,.2,1)}
.bar.solid{background:linear-gradient(var(--wine-2),var(--wine))}
.bar.gold{background:linear-gradient(var(--amber),var(--gold))}
.bar.hatch{background:var(--hatch);border:1px solid var(--line)}
.bar .tip{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap}
.bar .tip::after{content:"";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%) rotate(45deg);width:7px;height:7px;background:var(--fg)}
.bar-day{font-size:12px;font-weight:600;color:var(--muted)}
.bar-day.on{color:var(--fg)}

.reminder{padding:22px;border-radius:var(--r-xl)}
.reminder .rtitle{font-size:19px;font-weight:700;line-height:1.25;margin:4px 0 8px}
.reminder .rtime{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.reminder .rtime svg{width:15px;height:15px}
.reminder .btn{width:100%;justify-content:center;margin-top:16px}

.plist{display:flex;flex-direction:column;gap:3px}
.prow{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:12px;transition:.14s;cursor:pointer}
.prow:hover{background:var(--panel-2)}
.prow .pic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.prow .pic svg{width:17px;height:17px}
.prow .pm{min-width:0;flex:1}
.prow .pm .pt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pm .pd{font-size:11.5px;color:var(--faint);margin-top:2px}

.team-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.team-row:last-child{border-bottom:none}
.team-row .tm{min-width:0;flex:1}
.team-row .tm .tn{font-size:13.5px;font-weight:700}
.team-row .tm .tw{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-row .tw b{color:var(--fg);font-weight:600}
.st-tag{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}

.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.donut{position:relative;width:180px;height:120px}
.donut .pct{position:absolute;left:0;right:0;bottom:4px;text-align:center}
.donut .pct .n{font-size:34px;font-weight:800;line-height:1}
.donut .pct .l{font-size:12px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.legend .d{width:9px;height:9px;border-radius:50%}
.legend .d.hatch{background:var(--hatch);border:1px solid var(--line)}

.countdown{padding:22px;border-radius:var(--r-xl);color:#fff;background:linear-gradient(150deg,#1c1c20,#060606);position:relative;overflow:hidden}
.countdown::after{content:"";position:absolute;right:-50px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--wine-tint),transparent 65%);opacity:.9}
.countdown .ct{font-size:14px;font-weight:600;color:rgba(255,255,255,.7);position:relative}
.countdown .cnum{font-size:40px;font-weight:800;letter-spacing:.01em;margin:12px 0;position:relative;font-variant-numeric:tabular-nums}
.countdown .csub{position:relative;font-size:12.5px;color:rgba(255,255,255,.65);display:flex;align-items:center;gap:7px}
.countdown .csub .gd{width:9px;height:9px;border-radius:50%;background:var(--gold)}

/* filtros */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:20px}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:30px;font-size:13px;font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--muted);transition:.15s}
.chip:hover{border-color:var(--line-2);color:var(--fg)}
.chip.on{color:var(--fg);border-color:var(--line-2);background:var(--panel)}
.chip .swatch{width:10px;height:10px;border-radius:50%}
.chip-mine.on{background:var(--gold);color:#2a1f00;border-color:transparent}

.grid{display:grid;gap:16px}
.cols-auto{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}

/* task card */
.task{padding:17px 18px;cursor:pointer;transition:.15s;position:relative;overflow:hidden;border-radius:var(--r-lg)}
.task:hover{transform:translateY(-2px);border-color:var(--line-2)}
.rail{position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:4px}
.task .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:30px}
.pill .d{width:7px;height:7px;border-radius:50%}
.type-tag{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.task h3{font-size:16px;font-weight:700;margin-bottom:6px;line-height:1.25;padding-left:2px}
.task .desc{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px;padding-left:2px}
.task .meta-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px;padding-left:2px}
.task .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-left:2px}
.stack{display:flex;align-items:center}
.stack .avatar{width:27px;height:27px;font-size:10px;margin-left:-8px;border:2px solid var(--panel)}
.stack .avatar:first-child{margin-left:0}
.date-badge{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.date-badge.due-soon{color:var(--wine)}
.date-badge svg{width:13px;height:13px}
.net{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.net .nd{width:7px;height:7px;border-radius:50%}
.prio{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.prio .pf{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid currentColor}
.mini-check{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted)}
.mini-check svg{width:13px;height:13px}

/* tasks list view */
.tlist{display:flex;flex-direction:column;gap:2px;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.tlist-head,.tlist-row{display:grid;grid-template-columns:2.4fr 1fr 1fr 1fr 110px;gap:14px;align-items:center;padding:13px 18px}
.tlist-head{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;background:var(--panel-2);border-bottom:1px solid var(--line)}
.tlist-row{border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
.tlist-row:last-child{border-bottom:none}
.tlist-row:hover{background:var(--panel-2)}
.tlist-row .tt{font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px;min-width:0}
.tlist-row .tt .rail-s{width:4px;height:26px;border-radius:4px;flex:none}
.tlist-row .tt .tx{min-width:0}
.tlist-row .tt .tx .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlist-row .tt .tx .sm{font-size:11px;color:var(--faint);font-weight:500}
@media(max-width:860px){.tlist-head{display:none}.tlist-row{grid-template-columns:1fr;gap:8px;padding:15px 16px}.tlist-row .cell-h{font-size:10.5px;color:var(--faint);font-weight:700;text-transform:uppercase;margin-right:6px}}

/* calendar */
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.day-col{min-width:0}
.day-head{text-align:center;padding:9px 4px;border-radius:14px;margin-bottom:10px;background:var(--panel);border:1px solid var(--line)}
.day-head.today{background:var(--wine);color:#fff;border-color:transparent}
.day-head .dn{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;opacity:.8;font-weight:700}
.day-head .dd{font-size:19px;font-weight:800;line-height:1.1}
.slot{display:flex;flex-direction:column;gap:9px}
.mini{padding:11px 12px;border-radius:14px;cursor:pointer;transition:.15s;border:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden}
.mini:hover{transform:translateY(-2px);border-color:var(--line-2)}
.mini .mrail{position:absolute;left:0;top:0;bottom:0;width:3px}
.mini .tt{font-size:12px;font-weight:700;line-height:1.2;margin-bottom:6px;padding-left:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .mm{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-left:5px}
.st-min{font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:20px}
.cal-month{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.mcell{min-height:98px;border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--panel);display:flex;flex-direction:column;gap:5px}
.mcell.dim{opacity:.35}
.mcell .mnum{font-size:12px;font-weight:700;color:var(--muted)}
.mcell.is-today .mnum{color:var(--wine)}
.mdot{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;line-height:1.1;padding:4px 6px;border-radius:8px;background:var(--panel-2);cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mdot .d{width:6px;height:6px;border-radius:50%;flex:none}
.weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:9px}
.weekday-row span{text-align:center;font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.cal-list-group{margin-bottom:22px}
.cal-list-date{font-size:13px;font-weight:800;color:var(--wine);margin-bottom:11px;display:flex;align-items:center;gap:9px}
.cal-list-date .cnt{font-size:11px;font-weight:700;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);padding:2px 9px;border-radius:20px}
.cal-legend{font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cal-legend b{color:var(--fg);font-weight:600}
.cal-legend .lg{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);padding:4px 9px;border-radius:20px;font-weight:600}
.cal-legend .lg svg{width:13px;height:13px}
.mini-stack .avatar{width:22px;height:22px;font-size:9px;margin-left:-6px;border:2px solid var(--panel)}
.mini-stack .avatar:first-child{margin-left:0}
.absence{margin-top:4px;display:flex;flex-direction:column;gap:6px;background:var(--wine-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.absence .at{font-size:11px;font-weight:700;color:var(--wine-2);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.absence .at svg{width:13px;height:13px}
.absence .ar{font-size:12.5px;color:var(--muted)}
.absence .ar b{color:var(--fg);font-weight:600}
.mcell{position:relative}
.mcell.clickable{cursor:pointer}
.add-plus{position:absolute;bottom:5px;right:5px;width:22px;height:22px;border-radius:7px;background:var(--wine-soft);color:var(--wine-2);display:grid;place-items:center;opacity:0;transition:.14s;border:none}
.mcell.clickable:hover .add-plus{opacity:1}
.add-plus svg{width:14px;height:14px}
@media(hover:none){.add-plus{display:none}}
.add-day{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;border-radius:12px;border:1px dashed var(--line-2);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;transition:.14s}
.add-day:hover{border-color:var(--wine);color:var(--wine-2);background:var(--wine-soft)}
.add-day svg{width:14px;height:14px}

/* ideas */
.idea{padding:18px;display:flex;flex-direction:column;gap:12px;border-radius:var(--r-lg)}
.idea .itop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.idea .trend{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:5px 11px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.idea h3{font-size:16px;font-weight:700;line-height:1.3}
.idea p{font-size:13px;color:var(--muted);margin:0}
.idea .ifoot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.idea-st{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.like{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 11px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);transition:.15s}
.like.on{color:var(--gold);border-color:var(--gold)}
.like svg{width:14px;height:14px}
.idea .icount{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.idea .icount svg{width:13px;height:13px}
/* ideas list */
.ilist{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--panel)}
.irow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
.irow:last-child{border-bottom:none}
.irow:hover{background:var(--panel-2)}
.irow .im{flex:1;min-width:0}
.irow .im .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .im .ds{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* meetings */
.meet{padding:19px;display:flex;flex-direction:column;gap:14px;border-radius:var(--r-lg)}
.meet .mhead{display:flex;align-items:flex-start;gap:14px}
.caldate{flex:none;width:56px;text-align:center;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.caldate .mo{background:var(--wine);color:#fff;font-size:10px;font-weight:800;padding:4px;text-transform:uppercase;letter-spacing:.04em}
.caldate .dy{font-size:23px;font-weight:800;padding:6px 0;line-height:1}
.meet h3{font-size:16.5px;font-weight:700}
.mline{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.mline svg{width:14px;height:14px;flex:none}
.modality{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
.mod-pres{background:var(--gold-soft);color:var(--gold)}
.mod-virt{background:var(--wine-soft);color:var(--wine-2)}
.agenda{font-size:12.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.agenda b{color:var(--fg);font-weight:600}
.rsvp{display:flex;gap:8px;flex-wrap:wrap}
.rbtn{flex:1;min-width:96px;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:13px;font-size:12.5px;font-weight:600;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);transition:.15s}
.rbtn svg{width:15px;height:15px}
.rbtn:hover{border-color:var(--line-2);color:var(--fg)}
.rbtn.on-yes{background:var(--st-apro);color:#fff;border-color:transparent}
.rbtn.on-late{background:var(--gold);color:#2a1f00;border-color:transparent}
.rbtn.on-no{background:var(--wine);color:#fff;border-color:transparent}
.rsvp-list{display:flex;flex-wrap:wrap;gap:7px}
.who-mini{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);padding:4px 11px 4px 4px;border-radius:20px}
.who-mini .avatar{width:21px;height:21px;font-size:9px}

/* pastoral */
.notice{display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:var(--gold-soft);border:1px solid var(--gold);margin-bottom:20px;font-size:13px}
.notice svg{width:19px;height:19px;color:var(--gold);flex:none;margin-top:1px}
.comment{padding:17px 18px;display:flex;flex-direction:column;gap:10px;border-radius:var(--r-lg)}
.comment.private{border-color:var(--gold);background:linear-gradient(var(--gold-soft),var(--gold-soft)),var(--panel)}
.comment .chead{display:flex;align-items:center;gap:11px}
.comment .chead .meta{min-width:0;flex:1}
.comment .chead .nm{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.comment .chead .tm{font-size:11px;color:var(--faint)}
.lock-tag{font-size:9.5px;font-weight:800;color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold);padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;display:inline-flex;align-items:center;gap:4px}
.lock-tag svg{width:10px;height:10px;color:var(--gold)}
.comment .ref{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.comment .ref svg{width:14px;height:14px;flex:none}
.comment .body{font-size:14px;line-height:1.55}
.comment-box{padding:18px;display:flex;flex-direction:column;gap:13px;border-radius:var(--r-lg)}

/* roles + users */
.roles-grid{display:grid;gap:15px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.role-card{padding:19px;display:flex;flex-direction:column;gap:12px;border-radius:var(--r-lg)}
.rc-head{display:flex;align-items:center;gap:12px}
.rc-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff}
.rc-ic svg{width:21px;height:21px}
.role-card h3{font-size:15px;font-weight:700}
.rc-sub{font-size:11.5px;color:var(--muted)}
.perm{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--muted)}
.perm svg{width:16px;height:16px;flex:none;margin-top:1px}
.perm.yes svg{color:var(--st-apro)}
.perm.no svg{color:var(--wine)}

.ucount{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.uc{padding:16px 18px;border-radius:var(--r-lg);background:var(--panel);border:1px solid var(--line)}
.uc .n{font-size:28px;font-weight:800;line-height:1}
.uc .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:6px}
.utable{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--panel)}
.urow{display:grid;grid-template-columns:2fr 1.3fr 1fr 120px;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:none}
.urow.head{background:var(--panel-2);font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.uperson{display:flex;align-items:center;gap:11px;min-width:0}
.uperson .un{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uperson .ue{font-size:11.5px;color:var(--muted)}
.role-badge{font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;width:fit-content}
.urow .acts{display:flex;gap:7px;justify-content:flex-end}
.urow .acts .ib{width:34px;height:34px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;transition:.14s}
.urow .acts .ib:hover{border-color:var(--line-2)}
.urow .acts .ib svg{width:16px;height:16px}
.u-plan{font-size:10px;font-weight:700;color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold);padding:2px 8px;border-radius:20px;margin-left:7px}
.u-off{opacity:.5}
.u-off .un::after{content:" · inactivo";color:var(--wine);font-weight:600;font-size:11px}
@media(max-width:760px){.ucount{grid-template-columns:repeat(2,1fr)}.urow{grid-template-columns:1fr auto;gap:10px}.urow .ucol-role,.urow .ucol-access{display:none}.urow.head{display:none}}

/* search results */
.searchwrap{position:relative;flex:1;max-width:460px}
.searchwrap .search{max-width:none;width:100%;flex:none}
#searchMenu{left:0;right:0;min-width:0;max-height:62vh;overflow:auto;padding:8px}
.res-type{font-size:10px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-left:auto}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(252px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.kcol{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;min-height:170px;transition:.15s;display:flex;flex-direction:column;gap:10px}
.kcol.over{border-color:var(--wine);background:var(--wine-soft)}
.kcol-head{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:3px 5px}
.kcol-head .kdot{width:9px;height:9px;border-radius:50%}
.kcol-head .kcnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1px 9px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px;cursor:grab;transition:.14s;position:relative}
.kcard:active{cursor:grabbing}
.kcard:hover{border-color:var(--line-2)}
.kcard.dragging{opacity:.45}
.kcard .krail{position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px}
.kcard .kt{font-size:13.5px;font-weight:700;line-height:1.28;margin-bottom:9px;padding-left:5px}
.kcard .kmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-left:5px}
.kempty{font-size:11.5px;color:var(--faint);text-align:center;padding:16px 0}

/* activity */
.act-row{display:flex;gap:11px;padding:7px 0}
.act-row .adot{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.act-row .adot svg{width:14px;height:14px}
.act-row .atx{font-size:12.5px;line-height:1.4}
.act-row .atx .am{color:var(--faint);font-size:11px;margin-top:2px}

/* workload */
.workload{display:flex;flex-direction:column;gap:12px}
.wl-row{display:flex;align-items:center;gap:12px}
.wl-row .wn{width:130px;flex:none;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.wl-row .wn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-row .wbar{flex:1;height:10px;border-radius:10px;background:var(--panel-2);overflow:hidden}
.wl-row .wbar .wf{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--wine),var(--gold))}
.wl-row .wc{font-size:12.5px;font-weight:700;color:var(--muted);width:28px;text-align:right}
@media(max-width:560px){.wl-row .wn{width:96px}}

/* invitar + correo */
.invite-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:5px 10px 5px 5px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line)}
.invite-chip .avatar{width:20px;height:20px;font-size:8.5px}
.invite-chip button{display:grid;place-items:center;color:var(--muted);opacity:.7}
.invite-chip button svg{width:12px;height:12px}
.email{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel-2)}
.email .eh{padding:14px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.email .eh .er{display:flex;gap:8px;padding:2px 0;min-width:0}
.email .eh .er b{color:var(--fg);font-weight:600;width:48px;flex:none}
.email .eh .er span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.email .eb{padding:24px 18px;text-align:center;background:var(--panel)}
.email .elogo{width:54px;height:54px;border-radius:50%;margin:0 auto 14px;object-fit:cover;background:#fff;border:1px solid var(--line);display:block}
.email .eb h3{font-size:18px;margin-bottom:6px}
.email .ecard{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0;font-size:13px}
.email .ecard .el{display:flex;gap:8px;padding:4px 0;color:var(--muted)}
.email .ecard .el b{color:var(--fg);width:78px;flex:none;font-weight:600}
.email .ebtn{display:inline-block;background:var(--wine);color:#fff;font-weight:700;padding:12px 26px;border-radius:12px;text-decoration:none;font-size:14px}
.email .ef{font-size:11px;color:var(--faint);margin-top:16px}
.email-tag{display:inline-flex;align-items:center;gap:5px}

/* placeholder */
.ph{padding:60px 24px;text-align:center;color:var(--muted)}
.ph svg{width:46px;height:46px;opacity:.5;margin-bottom:14px}
.ph h3{font-size:18px;color:var(--fg);margin-bottom:6px}

/* forms */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field .hint{font-size:11px;color:var(--faint);font-weight:500}
.input,.area,select.input{width:100%;padding:12px 14px;border-radius:13px;background:var(--panel-2);border:1px solid var(--line);outline:none;transition:.15s}
.input:focus,.area:focus,select.input:focus{border-color:var(--wine)}
.area{resize:vertical;min-height:80px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pickset{display:flex;flex-wrap:wrap;gap:8px}
.pick{padding:9px 14px;border-radius:30px;font-size:12.5px;font-weight:600;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);transition:.15s;display:inline-flex;align-items:center;gap:7px}
.pick.on{background:var(--wine);color:#fff;border-color:transparent}
.pick.on .nd{box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.pick .nd{width:8px;height:8px;border-radius:50%}
.sect-sep{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 12px;padding-top:6px;border-top:1px solid var(--line)}
.sect-sep:first-child{border-top:none;padding-top:0}
/* dynamic rows */
.dyn-item{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dyn-item .input{flex:1}
.dyn-del{width:38px;height:38px;flex:none;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.dyn-del:hover{color:var(--wine);border-color:var(--wine)}
.dyn-del svg{width:15px;height:15px}
.dyn-add{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--wine);padding:6px 2px;margin-top:2px}
.dyn-add svg{width:15px;height:15px}
.chk-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);margin-bottom:7px}
.chk-row .cbox{width:20px;height:20px;border-radius:7px;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;cursor:pointer;transition:.14s}
.chk-row .cbox.on{background:var(--st-apro);border-color:transparent;color:#fff}
.chk-row .cbox svg{width:13px;height:13px;opacity:0}
.chk-row .cbox.on svg{opacity:1}
.chk-row .ctxt{flex:1;font-size:13.5px}
.chk-row.done .ctxt{text-decoration:line-through;color:var(--muted)}
.tagchips{display:flex;flex-wrap:wrap;gap:7px}
.tagchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;background:var(--wine-soft);color:var(--wine-2);border:1px solid transparent}
.tagchip button{display:grid;place-items:center;color:inherit;opacity:.7}

async function loadAll(authUser){
  S.currentUserId=authUser.id;
  const q=async(tbl,ord)=>{let r=sb.from(tbl).select('*');if(ord)r=r.order(ord,{ascending:true});const{data,error}=await r;if(error)throw error;return data||[];};
  try{
    let profs=await q('profiles');
    if(!profs.find(p=>p.id===authUser.id)){
      await sb.from('profiles').insert({id:authUser.id,name:(authUser.user_metadata&&authUser.user_metadata.name)||(authUser.email||'').split('@')[0],email:authUser.email});
      profs=await q('profiles');
    }
    S.users=profs;
    S.tasks=(await q('tasks','created_at')).map(rowToTask);
    S.ideas=(await q('ideas','created_at')).map(rowToIdea);
    S.meetings=(await q('meetings','meet_date')).map(rowToMeeting);
    S.services=(await q('services','service_date')).map(rowToService);
    S.pastoralComments=(await q('pastoral_comments','created_at')).map(rowToPastoral);
    S.publicComments=(await q('public_comments','created_at')).map(rowToPublic);
    S.notifications=(await q('notifications','created_at')).map(rowToNotif).reverse();
  }catch(e){console.error(e);if(window.toast)toast('Error cargando: '+(e.message||e));}
}

    if(!items.length)col.appendChild(el("div","kempty","—"));
    items.forEach(t=>{
      const card=el("div","kcard");card.draggable=true;card.dataset.id=t.id;
      card.innerHTML=`<span class="krail" style="background:${AREAS[t.area].color}"></span><div class="kt">${esc(t.title)}</div><div class="kmeta">${prioPill(t.priority)}<div class="stack">${av(t.assignees.diseno)}</div></div>`;
      card.onclick=()=>openTaskDetail(t.id);
      card.addEventListener("dragstart",e=>{card.classList.add("dragging");e.dataTransfer.setData("text/plain",t.id);e.dataTransfer.effectAllowed="move";});
      card.addEventListener("dragend",()=>card.classList.remove("dragging"));
      col.appendChild(card);
    });
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("over");});
    col.addEventListener("dragleave",()=>col.classList.remove("over"));
    col.addEventListener("drop",e=>{e.preventDefault();col.classList.remove("over");const id=e.dataTransfer.getData("text/plain");const t=S.tasks.find(x=>x.id===id);if(t&&t.status!==k){if(!can("createTask")){toast("Solo liderazgo o planificadores mueven piezas");return;}t.status=k;logActivity(t,`movió la pieza a <b>${s.label}</b>`);saveTask(t);render();toast("Estado: "+s.label);}});
    board.appendChild(col);

  return board;
}

/* ── Búsqueda global ── */
let _searchRes=[];
function runSearch(q){
  q=(q||"").trim().toLowerCase();const menu=$("#searchMenu");_searchRes=[];
  if(!q){menu.hidden=true;return;}
  S.tasks.forEach(t=>{if((t.title+" "+t.desc+" "+(t.tags||[]).join(" ")).toLowerCase().includes(q))_searchRes.push({type:"Tarea",title:t.title,go:()=>openTaskDetail(t.id)});});
  S.ideas.forEach(i=>{if((i.title+" "+i.desc).toLowerCase().includes(q))_searchRes.push({type:"Idea",title:i.title,go:()=>{S.ui.view="ideas";render();openIdeaDetail(i.id);}});});
  S.meetings.forEach(m=>{if(m.title.toLowerCase().includes(q))_searchRes.push({type:"Reunión",title:m.title,go:()=>{S.ui.view="reuniones";render();}});});
  S.users.forEach(u=>{if(u.active&&u.name.toLowerCase().includes(q))_searchRes.push({type:"Usuario",title:u.name,go:()=>{S.ui.view="usuarios";render();openUserForm(u.id);}});});
  menu.innerHTML="";
  if(!_searchRes.length){menu.innerHTML="<div style='padding:14px;font-size:12.5px;color:var(--muted);text-align:center'>Sin resultados</div>";menu.hidden=false;return;}
  _searchRes.slice(0,8).forEach(r=>{const b=el("button","mi");b.innerHTML=`<div class="meta"><div class="n">${esc(r.title)}</div></div><span class="res-type">${r.type}</span>`;b.onclick=()=>{menu.hidden=true;$("#searchInput").value="";r.go();};menu.appendChild(b);});
  menu.hidden=false;
}

function addOn(dateIso){if(!can("createTask")){toast("No tienes permiso para crear tareas");return;}openTaskForm({publish:dateIso,due:dateIso});}

function miniTask(t){const s=STATUS[t.status];const c=el("div","mini");const dis=t.assignees.diseno,pub=t.assignees.publica;const stack=`<div class="stack mini-stack" title="Diseña: ${esc(user(dis).name)} · Publica: ${esc(user(pub).name)}">${av(dis)}${pub!==dis?av(pub):""}</div>`;c.innerHTML=`<span class="mrail" style="background:${AREAS[t.area].color}"></span><div class="tt">${esc(t.title)}</div><div class="mm"><span class="st-min" style="background:color-mix(in srgb,${s.color} 15%,transparent);color:${s.color}">${s.label}</span>${stack}</div>`;c.onclick=()=>openTaskDetail(t.id);return c;}
function calWeek(){
  const wrap=el("div");
  wrap.appendChild(el("div","cal-legend",`<span class="lg">${I.roles.replace('<svg ','<svg width="13" height="13" ')} Diseña</span><span class="lg">${I.arrow.replace('<svg ','<svg width="13" height="13" ')} Publica</span><span>En cada pieza, el <b>1.º</b> avatar diseña y el <b>2.º</b> publica.</span>`));
  const box=el("div","cal-week");const start=new Date(today);const dow=(start.getDay()+6)%7;start.setDate(start.getDate()-dow);const tasks=visibleTasks();

function calMonth(){
  const wrap=el("div");const base=new Date(today.getFullYear(),today.getMonth()+S.ui.monthOffset,1);const moN=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

  nav.appendChild(prev);nav.appendChild(el("div","",`<b style="font-size:18px">${moN[base.getMonth()]} ${base.getFullYear()}</b>`));nav.appendChild(next);wrap.appendChild(nav);

  const grid=el("div","cal-month");const firstDow=(base.getDay()+6)%7,dim=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();const tasks=visibleTasks();

function calList(){

function ideaCard(i){
  const c=el("div","card idea");const liked=i.likes.includes(me().id);

    <div class="ifoot"><div style="display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)">${av(i.by)}<span>${user(i.by).name}</span></div>
    <div style="display:flex;align-items:center;gap:8px"><span class="icount">${I.chat.replace('width="24"','width="13" height="13"')} ${(i.comments||[]).length}</span><button class="like${liked?' on':''}">${liked?I.heart:I.heartO}<span>${i.likes.length}</span></button></div></div>`;

function openTaskDetail(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;const body=el("div");
  body.innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">${statusPill(t.status)}${prioPill(t.priority)}<span class="pill" style="background:color-mix(in srgb,${AREAS[t.area].color} 15%,transparent);color:${AREAS[t.area].color}"><span class="d" style="background:${AREAS[t.area].color}"></span>${AREAS[t.area].label}</span><span class="pill" style="background:var(--panel-2);color:var(--muted)">${t.type}</span></div><p style="font-size:14px;line-height:1.6;margin:0 0 6px">${esc(t.desc)}</p>`;
  if((t.networks||[]).length){const nn=el("div");nn.style.cssText="display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 2px";nn.innerHTML=t.networks.map(netPill).join("");body.appendChild(nn);}
  if(t.caption){const cap=el("div");cap.style.cssText="margin-top:14px";cap.innerHTML=`<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px">CAPTION / COPY</div><div style="font-size:13.5px;line-height:1.55;background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:12px 14px">${esc(t.caption)}</div>`;body.appendChild(cap);}
  // checklist
  const prog=checkProgress(t);
  if(prog){const cl=el("div","d-sect");cl.innerHTML=`<div class="dt">Subtareas <span style="color:var(--faint)">${prog.done}/${prog.total}</span></div><div class="progress-bar" style="margin-bottom:12px"><div class="fill" style="width:${prog.pct}%"></div></div>`;
    t.checklist.forEach((item,idx)=>{const r=el("div","chk-row"+(item.d?" done":""));r.innerHTML=`<div class="cbox${item.d?" on":""}">${I.check}</div><div class="ctxt">${esc(item.t)}</div>`;r.querySelector(".cbox").onclick=()=>{t.checklist[idx].d=!t.checklist[idx].d;saveTask(t);closeDrawer();openTaskDetail(id);};cl.appendChild(r);});body.appendChild(cl);}
  // responsables + fechas
  const rows=el("div");rows.style.marginTop="18px";const row=(k,ic,v)=>`<div class="d-row"><span class="k">${ic}${k}</span><span class="v">${v}</span></div>`;
  rows.innerHTML=row("Diseña",I.roles,`<div style="display:flex;align-items:center;gap:8px">${av(t.assignees.diseno)}${user(t.assignees.diseno).name}</div>`)+row("Redacta",I.chat,`<div style="display:flex;align-items:center;gap:8px">${av(t.assignees.copy)}${user(t.assignees.copy).name}</div>`)+row("Publica",I.arrow,`<div style="display:flex;align-items:center;gap:8px">${av(t.assignees.publica)}${user(t.assignees.publica).name}</div>`)+row("Entrega",I.clock,fmtDate(t.due))+row("Publicación",I.cal,fmtDate(t.publish));body.appendChild(rows);
  if((t.tags||[]).length){const tg=el("div");tg.style.cssText="margin-top:14px";tg.innerHTML=`<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px">ETIQUETAS</div><div class="tagchips">`+t.tags.map(x=>`<span class="tagchip">#${esc(x)}</span>`).join("")+`</div>`;body.appendChild(tg);}
  if((t.links||[]).length){const lk=el("div");lk.style.marginTop="14px";lk.innerHTML=`<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px">ADJUNTOS Y LINKS</div>`;t.links.forEach(l=>lk.appendChild(el("div","link-row",I.link+`<span>${esc(l.name)}</span>`)));body.appendChild(lk);}
  // compartir
  {const sh=el("div","d-sect");sh.innerHTML=`<div class="dt">Compartir</div>`;const lb=el("div","link-row");lb.innerHTML=`${I.link}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${taskLink(t)}</span>`;sh.appendChild(lb);const sr=el("div");sr.style.cssText="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap";const cp=el("button","btn btn-ghost btn-sm",I.link+"Copiar enlace");cp.onclick=()=>copyText(taskLink(t),"Enlace copiado");const wa=el("a","btn btn-sm");wa.style.cssText="background:#25d366;color:#07321a;text-decoration:none";wa.href="https://wa.me/?text="+encodeURIComponent(taskShareText(t));wa.target="_blank";wa.rel="noopener";wa.innerHTML=`${I.wa.replace('<svg ','<svg width="16" height="16" ')}Recordar por WhatsApp`;sr.appendChild(cp);sr.appendChild(wa);sh.appendChild(sr);body.appendChild(sh);}
  // historial de actividad
  {const actArr=(t.activity&&t.activity.length)?t.activity:[{who:t.assignees.diseno,time:"Al crear",text:"creó la pieza"}];const as=el("div","d-sect");as.innerHTML=`<div class="dt">Actividad</div>`;const wa=el("div");actArr.slice(0,8).forEach(a=>{wa.appendChild(el("div","act-row",`<div class="adot">${I.clock}</div><div class="atx"><b>${user(a.who).name}</b> ${a.text}<div class="am">${a.time}</div></div>`));});as.appendChild(wa);body.appendChild(as);}
  // comentarios en la pieza
  const cs=el("div","d-sect");cs.innerHTML=`<div class="dt">Comentarios del equipo (${(t.comments||[]).length})</div>`;(t.comments||[]).forEach(cm=>cs.appendChild(el("div","d-comment",`${av(cm.by)}<div class="dc"><div class="dn">${user(cm.by).name} <span style="font-weight:400;color:var(--faint);font-size:11px">${cm.time}</span></div><div class="db">${esc(cm.body)}</div></div>`)));
  const add=el("div","inline-add");const inp=el("input","input");inp.placeholder="Escribe un comentario…";const sb=el("button","btn btn-pri btn-sm",I.arrow);sb.onclick=()=>{if(!inp.value.trim())return;t.comments=t.comments||[];t.comments.push({by:me().id,time:"Ahora",body:inp.value.trim()});logActivity(t,"comentó la pieza");saveTask(t);closeDrawer();openTaskDetail(id);};add.appendChild(inp);add.appendChild(sb);cs.appendChild(add);body.appendChild(cs);
  // estado (liderazgo/planner)
  if(can("createTask")){const sc=el("div");sc.style.marginTop="20px";sc.innerHTML=`<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:9px">CAMBIAR ESTADO</div>`;const ps=el("div","pickset");Object.entries(STATUS).forEach(([k,st])=>{const b=el("button","pick"+(t.status===k?" on":""),st.label);b.onclick=()=>{t.status=k;logActivity(t,`cambió el estado a <b>${st.label}</b>`);saveTask(t);closeDrawer();openTaskDetail(id);toast("Estado: "+st.label);};ps.appendChild(b);});sc.appendChild(ps);body.appendChild(sc);}
  // footer acciones
  let foot=null;
  if(can("approve")||can("createTask")){foot=el("div");foot.style.cssText="display:flex;gap:10px;width:100%";
    if(can("createTask")){const edit=el("button","btn btn-ghost",I.edit+"Editar");edit.onclick=()=>openTaskForm(t,t.id);foot.appendChild(edit);}
    if(can("approve")&&t.status==="revision"){const appr=el("button","btn btn-pri",I.check+"Aprobar");appr.onclick=()=>{t.status="aprobado";logActivity(t,"aprobó la pieza");saveTask(t);closeDrawer();render();toast("Pieza aprobada ✓");};foot.appendChild(appr);}
    else if(can("approve")&&t.status!=="publicado"){const req=el("button","btn btn-ghost",I.chat+"Pedir cambios");req.onclick=()=>{t.status="proceso";logActivity(t,"pidió cambios");saveTask(t);closeDrawer();openTaskDetail(id);toast("Enviada a cambios");};foot.appendChild(req);}
  }
  openDrawer(t.title,t.type+" · "+AREAS[t.area].label,body,foot);
}

function openTaskForm(prefill={},editId){
  if(!can("createTask")){toast("No tienes permiso para crear tareas");return;}
  const editing=!!editId;
  let type=prefill.type||"Reel",area=prefill.area||"redes",priority=prefill.priority||"media";
  let nets=new Set(prefill.networks||[]);
  let checklist=(prefill.checklist||[]).map(x=>({...x}));
  let links=(prefill.links||[]).map(x=>({...x}));
  let tags=[...(prefill.tags||[])];
  const body=el("div");
  body.innerHTML=`
    <div class="sect-sep">Información básica</div>
    <div class="field"><label>Título de la pieza</label><input class="input" id="f-title" placeholder="Ej: Reel – Testimonio del domingo" value="${prefill.title?esc(prefill.title):""}"></div>
    <div class="field"><label>Descripción / brief</label><textarea class="area" id="f-desc" placeholder="Qué hay que hacer, tono, detalles…">${prefill.desc?esc(prefill.desc):""}</textarea></div>
    <div class="field"><label>Tipo de contenido</label><div class="pickset" id="f-type"></div></div>
    <div class="row2"><div class="field"><label>Área</label><div class="pickset" id="f-area"></div></div><div class="field"><label>Prioridad</label><div class="pickset" id="f-prio"></div></div></div>
    <div class="field"><label>Redes destino</label><div class="pickset" id="f-nets"></div></div>
    <div class="sect-sep">Planificación</div>
    <div class="row2"><div class="field"><label>Fecha de entrega</label><input class="input" type="date" id="f-due" value="${prefill.due||iso(dayOffset(2))}"></div><div class="field"><label>Fecha de publicación</label><input class="input" type="date" id="f-pub" value="${prefill.publish||iso(dayOffset(4))}"></div></div>
    <div class="field"><label>Responsables</label><div style="display:flex;flex-direction:column;gap:9px">
      <div style="display:flex;align-items:center;gap:9px"><span style="font-size:12.5px;color:var(--muted);width:72px">Diseña</span><select class="input" id="f-dis"></select></div>
      <div style="display:flex;align-items:center;gap:9px"><span style="font-size:12.5px;color:var(--muted);width:72px">Redacta</span><select class="input" id="f-cop"></select></div>
      <div style="display:flex;align-items:center;gap:9px"><span style="font-size:12.5px;color:var(--muted);width:72px">Publica</span><select class="input" id="f-pub2"></select></div>
    </div></div>
    <div class="sect-sep">Contenido</div>
    <div class="field"><label>Caption / copy</label><textarea class="area" id="f-cap" placeholder="El texto que va con la publicación…">${prefill.caption?esc(prefill.caption):""}</textarea></div>
    <div class="field"><label>Subtareas / checklist</label><div id="f-check"></div><button class="dyn-add" id="f-check-add">${I.plus}Agregar subtarea</button></div>
    <div class="field"><label>Etiquetas</label><div class="tagchips" id="f-tags" style="margin-bottom:8px"></div><input class="input" id="f-tag-input" placeholder="Escribe y pulsa Enter (ej: domingo)"></div>
    <div class="field"><label>Links y adjuntos</label><div id="f-links"></div><button class="dyn-add" id="f-links-add">${I.plus}Agregar link</button></div>`;
  // pickers
  const mkPick=(host,items,cur,set)=>{Object.entries(items).forEach(([k,o])=>{const label=o.label||o;const dot=o.color?`<span class="nd" style="background:${o.color}"></span>`:"";const b=el("button","pick"+(cur()===k?" on":""),dot+label);b.onclick=()=>{set(k);host.querySelectorAll(".pick").forEach(x=>x.classList.remove("on"));b.classList.add("on");};host.appendChild(b);});};
  const tp=body.querySelector("#f-type");TYPES.forEach(t=>{const b=el("button","pick"+(t===type?" on":""),t);b.onclick=()=>{type=t;tp.querySelectorAll(".pick").forEach(x=>x.classList.remove("on"));b.classList.add("on");};tp.appendChild(b);});
  mkPick(body.querySelector("#f-area"),AREAS,()=>area,v=>area=v);
  mkPick(body.querySelector("#f-prio"),PRIORITY,()=>priority,v=>priority=v);
  // networks multi
  const np=body.querySelector("#f-nets");Object.entries(NETWORKS).forEach(([k,n])=>{const b=el("button","pick"+(nets.has(k)?" on":""),`<span class="nd" style="background:${n.color}"></span>${n.label}`);b.onclick=()=>{if(nets.has(k))nets.delete(k);else nets.add(k);b.classList.toggle("on");};np.appendChild(b);});
  // selects
  const opts=S.users.filter(u=>u.active).map(u=>`<option value="${u.id}">${esc(u.name)} · ${esc(u.sub)}</option>`).join("");
  const setSel=(id,val)=>{const s=body.querySelector(id);s.innerHTML=opts;if(val&&user(val).id!=="—")s.value=val;};
  setSel("#f-dis",prefill.assignees?prefill.assignees.diseno:me().id);setSel("#f-cop",prefill.assignees?prefill.assignees.copy:me().id);setSel("#f-pub2",prefill.assignees?prefill.assignees.publica:me().id);
  // checklist dinámico
  const checkHost=body.querySelector("#f-check");
  const renderCheck=()=>{checkHost.innerHTML="";checklist.forEach((it,idx)=>{const r=el("div","dyn-item");const inp=el("input","input");inp.value=it.t;inp.placeholder="Subtarea…";inp.oninput=()=>checklist[idx].t=inp.value;const del=el("button","dyn-del",I.trash);del.onclick=()=>{checklist.splice(idx,1);renderCheck();};r.appendChild(inp);r.appendChild(del);checkHost.appendChild(r);});};
  body.querySelector("#f-check-add").onclick=()=>{checklist.push({t:"",d:false});renderCheck();};renderCheck();
  // tags
  const tagHost=body.querySelector("#f-tags");const renderTags=()=>{tagHost.innerHTML="";tags.forEach((tg,idx)=>{const c=el("span","tagchip",`#${esc(tg)}`);const b=el("button",null,I.x);b.onclick=()=>{tags.splice(idx,1);renderTags();};c.appendChild(b);tagHost.appendChild(c);});};renderTags();
  const tagInput=body.querySelector("#f-tag-input");tagInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const v=tagInput.value.trim().replace(/^#/,"");if(v&&!tags.includes(v)){tags.push(v);renderTags();}tagInput.value="";}});
  // links
  const linkHost=body.querySelector("#f-links");const renderLinks=()=>{linkHost.innerHTML="";links.forEach((lk,idx)=>{const r=el("div","dyn-item");const inp=el("input","input");inp.value=lk.name;inp.placeholder="Nombre del link (ej: Material en Drive)";inp.oninput=()=>links[idx].name=inp.value;const del=el("button","dyn-del",I.trash);del.onclick=()=>{links.splice(idx,1);renderLinks();};r.appendChild(inp);r.appendChild(del);linkHost.appendChild(r);});};
  body.querySelector("#f-links-add").onclick=()=>{links.push({name:"",url:"#"});renderLinks();};renderLinks();
  // footer
  const foot=el("div");foot.style.cssText="display:flex;gap:10px;width:100%";const cancel=el("button","btn btn-ghost","Cancelar");cancel.onclick=()=>closeDrawer();const sv=el("button","btn btn-pri",I.check+(editing?"Guardar":"Crear tarea"));
  sv.onclick=()=>{const title=body.querySelector("#f-title").value.trim();if(!title){toast("Ponle un título a la tarea");return;}
    const data={title,type,area,priority,networks:[...nets],desc:body.querySelector("#f-desc").value.trim()||"Sin descripción.",caption:body.querySelector("#f-cap").value.trim(),assignees:{diseno:body.querySelector("#f-dis").value,copy:body.querySelector("#f-cop").value,publica:body.querySelector("#f-pub2").value},due:body.querySelector("#f-due").value,publish:body.querySelector("#f-pub").value,tags:tags.slice(),checklist:checklist.filter(x=>x.t.trim()),links:links.filter(x=>x.name.trim())};
    if(editing){const t=S.tasks.find(x=>x.id===editId);Object.assign(t,data);logActivity(t,"editó la pieza");saveTask(t);toast("Tarea actualizada");closeDrawer();render();}
    else{S.tasks.unshift({id:uid(),status:"pendiente",comments:[],activity:[{who:me().id,time:"Ahora",text:"creó la pieza"}],...data});saveTask(S.tasks[0]);toast("Tarea creada");closeDrawer();if(S.ui.view!=="tareas"&&S.ui.view!=="calendario"&&S.ui.view!=="dashboard"){S.ui.view="tareas";}render();}};
  foot.appendChild(cancel);foot.appendChild(sv);
  openDrawer(editing?"Editar tarea":"Nueva tarea",editing?prefill.title:"Crea una pieza de contenido",body,foot,true);
}

function openIdeaForm(){

  body.innerHTML=`<div class="field"><label>Tipo</label><div class="pickset" id="i-type"></div></div><div class="field"><label>Título de la idea</label><input class="input" id="i-title" placeholder="Ej: Reel al ritmo de la canción"></div><div class="field"><label>Descripción</label><textarea class="area" id="i-desc" placeholder="Explica el concepto, la referencia o el trend…"></textarea></div>`;
  const tp=body.querySelector("#i-type");IDEA_TYPES.forEach(t=>{const b=el("button","pick"+(t===type?" on":""),t);b.onclick=()=>{type=t;tp.querySelectorAll(".pick").forEach(x=>x.classList.remove("on"));b.classList.add("on");};tp.appendChild(b);});
  const foot=el("div");foot.style.cssText="display:flex;gap:10px;width:100%";const cancel=el("button","btn btn-ghost","Cancelar");cancel.onclick=()=>closeDrawer();const btn=el("button","btn btn-gold",I.check+"Guardar idea");btn.onclick=()=>{const title=body.querySelector("#i-title").value.trim();if(!title){toast("Ponle un título a la idea");return;}S.ideas.unshift({id:uid(),type,title,desc:body.querySelector("#i-desc").value.trim()||"Sin descripción.",by:me().id,likes:[],status:"nueva",comments:[]});saveIdea(S.ideas[0]);closeDrawer();S.ui.view="ideas";render();toast("Idea agregada al banco");};foot.appendChild(cancel);foot.appendChild(btn);

function meetingLink(m){return `https://redes.vinonuevo.app/r/${m.id}`;}

function meetingInvitees(m){if(m.invites&&m.invites.length)return m.invites;return Object.keys(m.rsvp||{}).map(uid=>({name:user(uid).name,email:emailOf(user(uid)),uid}));}

function openMeetingForm(){

  const teamHost=body.querySelector("#r-team"),invHost=body.querySelector("#r-invites");
  const syncTeam=()=>teamHost.querySelectorAll(".pick").forEach(p=>p.classList.toggle("on",invites.some(i=>i.uid===p.dataset.uid)));
  const renderInv=()=>{invHost.innerHTML="";if(!invites.length){invHost.innerHTML=`<span style="font-size:12px;color:var(--faint)">Nadie invitado todavía.</span>`;return;}invites.forEach((inv,idx)=>{const c=el("span","invite-chip");c.innerHTML=(inv.uid?av(inv.uid):`<span class="avatar" style="width:20px;height:20px;font-size:8.5px;background:var(--faint)">${initials(inv.name)}</span>`)+`<span>${esc(inv.email)}</span>`;const b=el("button",null,I.x);b.onclick=()=>{invites.splice(idx,1);renderInv();syncTeam();};c.appendChild(b);invHost.appendChild(c);});};
  S.users.filter(u=>u.active).forEach(u=>{const b=el("button","pick");b.dataset.uid=u.id;b.textContent=u.name;b.title=emailOf(u);b.onclick=()=>{const i=invites.findIndex(x=>x.uid===u.id);if(i>=0)invites.splice(i,1);else invites.push({name:u.name,email:emailOf(u),uid:u.id});renderInv();syncTeam();};teamHost.appendChild(b);});
  body.querySelector("#r-email-add").onclick=()=>{const inp=body.querySelector("#r-email");const em=inp.value.trim();if(!/.+@.+\..+/.test(em)){toast("Escribe un correo válido");return;}if(!invites.some(i=>i.email.toLowerCase()===em.toLowerCase()))invites.push({name:em.split("@")[0],email:em,uid:null});inp.value="";renderInv();};
  renderInv();
  const foot=el("div");foot.style.cssText="display:flex;gap:10px;width:100%";const cancel=el("button","btn btn-ghost","Cancelar");cancel.onclick=()=>closeDrawer();const btn=el("button","btn btn-pri",`${I.mail.replace('<svg ','<svg width="17" height="17" ')}Convocar e invitar`);
  btn.onclick=()=>{const title=body.querySelector("#r-title").value.trim();if(!title){toast("Ponle título a la reunión");return;}const rsvp={};invites.forEach(i=>{if(i.uid)rsvp[i.uid]=null;});const m={id:uid(),title,date:body.querySelector("#r-date").value,time:body.querySelector("#r-time").value||"—",modality,agenda:body.querySelector("#r-agenda").value.trim()||"Por definir.",rsvp,notes:{},invites};S.meetings.unshift(m);const _n={id:uid(),type:"meeting",who:me().id,text:`Nueva convocatoria: <b>${esc(title)}</b>`,time:"Ahora",unread:true,color:"#d4af37"};S.notifications.unshift(_n);saveMeeting(m);addNotif(_n);closeDrawer();S.ui.view="reuniones";render();toast(invites.length?`📧 Invitación enviada por correo a ${invites.length} ${invites.length===1?'persona':'personas'}`:"Reunión convocada");};
  foot.appendChild(cancel);foot.appendChild(btn);
  openDrawer("Convocar reunión","Invita por correo y les llega el enlace",body,foot);
}
function openRsvpNote(mid){
  const m=S.meetings.find(x=>x.id===mid);const body=el("div");body.innerHTML=`<p style="font-size:13.5px;color:var(--muted);margin:0 0 14px">Deja una nota breve con el motivo (opcional). El liderazgo la verá.</p><div class="field"><label>Motivo</label><textarea class="area" id="rn" placeholder="Ej: Tengo examen esa noche…"></textarea></div>`;
  const foot=el("div");foot.style.cssText="display:flex;gap:10px;width:100%";const cancel=el("button","btn btn-ghost","Volver");cancel.onclick=()=>closeDrawer();const btn=el("button","btn btn-pri","Confirmar ausencia");btn.style.background="var(--wine)";btn.onclick=()=>{m.rsvp[me().id]="no";m.notes=m.notes||{};m.notes[me().id]=body.querySelector("#rn").value.trim();saveMeeting(m);closeDrawer();render();toast("Avisaste que no podrás");};foot.appendChild(cancel);foot.appendChild(btn);
  openDrawer("No podré asistir","",body,foot);
}

/* ═══════════ Menús ═══════════ */
function buildUserMenu(){const m=$("#userMenu");m.innerHTML="";const u=me();m.appendChild(el("div","menu-lbl","Mi cuenta"));m.appendChild(el("div","mi sel",`${av(u.id)}<div class="meta"><div class="n">${esc(u.name)}</div><div class="r">${esc(u.sub||(ROLES[u.role]?ROLES[u.role].label:''))}${u.email?' · '+esc(u.email):''}</div></div>`));m.appendChild(el("div","menu-sep"));const out=el("button","mi",`${I.logout}<div class="meta"><div class="n">Cerrar sesión</div></div>`);out.onclick=()=>{m.hidden=true;sb.auth.signOut();};m.appendChild(out);}
function buildNotifMenu(){const m=$("#notifMenu");m.innerHTML="";m.appendChild(el("div","menu-lbl","Notificaciones"));m.appendChild(el("div","","<div style='padding:0 11px 8px;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:5px'>"+I.mail.replace('<svg ','<svg width=\"12\" height=\"12\" ')+" Cada notificación también se envía al correo.</div>"));const list=S.notifications.filter(n=>!(n.restricted&&!can("seePrivate")));if(!list.length)m.appendChild(el("div","","<div style='padding:14px;font-size:12.5px;color:var(--muted);text-align:center'>Nada nuevo por ahora</div>"));list.forEach(n=>{const icon={tag:I.tasks,meeting:I.users,pastor:I.shield}[n.type]||I.chat;const d=el("div","notif"+(n.unread?" unread":""));d.innerHTML=`<div class="nic" style="background:${n.color}">${icon}</div><div class="ntext"><div>${n.text}</div><div class="nt">${n.time} · ${I.mail.replace('<svg ','<svg width="11" height="11" style="display:inline;vertical-align:-1px" ')} por correo</div></div>`;m.appendChild(d);});const clr=el("button","btn btn-ghost","Marcar todo como leído");clr.style.cssText="width:100%;justify-content:center;margin-top:8px;font-size:12.5px";clr.onclick=()=>{S.notifications.forEach(n=>n.unread=false);m.hidden=true;renderShell();};m.appendChild(clr);}

/* ═══════════ Sidebar móvil ═══════════ */
function openSidebar(){$("#sidebar").classList.add("open");const b=$("#backdrop");b.hidden=false;requestAnimationFrame(()=>b.classList.add("show"));}
function closeSidebar(){$("#sidebar").classList.remove("open");const b=$("#backdrop");b.classList.remove("show");setTimeout(()=>{b.hidden=true;},200);}
$("#hambBtn").onclick=openSidebar;$("#backdrop").onclick=closeSidebar;

/* ═══════════ Eventos ═══════════ */
$("#whoBtn").onclick=e=>{e.stopPropagation();const m=$("#userMenu");$("#notifMenu").hidden=true;if(m.hidden){buildUserMenu();m.hidden=false;}else m.hidden=true;};
$("#bellBtn").onclick=e=>{e.stopPropagation();const m=$("#notifMenu");$("#userMenu").hidden=true;if(m.hidden){buildNotifMenu();m.hidden=false;}else m.hidden=true;};
document.addEventListener("click",()=>{$("#userMenu").hidden=true;$("#notifMenu").hidden=true;$("#searchMenu").hidden=true;});
$("#userMenu").onclick=e=>e.stopPropagation();$("#notifMenu").onclick=e=>e.stopPropagation();$("#searchMenu").onclick=e=>e.stopPropagation();
$("#promoBtn").onclick=()=>{S.ui.view="ayuda";closeSidebar();render();};
$("#searchInput").addEventListener("input",e=>runSearch(e.target.value));
$("#searchInput").addEventListener("click",e=>{e.stopPropagation();if(e.target.value.trim())runSearch(e.target.value);});
$("#searchInput").addEventListener("keydown",e=>{if(e.key==="Enter"){if(_searchRes[0]){$("#searchMenu").hidden=true;const g=_searchRes[0].go;e.target.value="";g();}}else if(e.key==="Escape"){$("#searchMenu").hidden=true;e.target.blur();}});
$("#themeBtn").onclick=()=>{const root=document.documentElement;const cur=root.getAttribute("data-theme");let next;if(cur==="dark")next="light";else if(cur==="light")next="dark";else next=window.matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark";root.setAttribute("data-theme",next);try{localStorage.setItem("vn-theme",next);}catch(e){}toast(next==="dark"?"Modo oscuro":"Modo claro");};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&drawerOpen)closeDrawer();});
try{const th=localStorage.getItem("vn-theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}

/* ===== Login / arranque ===== */
let loginMode="in";
function setLoginMode(m){loginMode=m;$("#l-go").textContent=m==="in"?"Entrar":"Crear cuenta";$("#lsub").textContent=m==="in"?"Entra con tu correo del equipo":"Crea tu cuenta del equipo";$("#l-switch").innerHTML=m==="in"?'¿Primera vez? <button type="button">Crear cuenta</button>':'¿Ya tienes cuenta? <button type="button">Entrar</button>';const b=$("#l-switch button");b.onclick=()=>setLoginMode(m==="in"?"up":"in");const msg=$("#l-msg");msg.textContent="";msg.className="login-msg";}
async function doLogin(){
  const email=$("#l-email").value.trim(),pass=$("#l-pass").value,msg=$("#l-msg");msg.className="login-msg";
  if(!email||!pass){msg.textContent="Pon tu correo y tu contraseña.";msg.className="login-msg err";return;}
  $("#l-go").disabled=true;
  try{
    if(loginMode==="in"){
      const{error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
    }else{
      const{data,error}=await sb.auth.signUp({email,password:pass});
      if(error)throw error;
      if(!data.session){msg.textContent="¡Cuenta creada! Revisa tu correo y confirma para entrar.";msg.className="login-msg ok";}
    }
  }catch(e){msg.textContent=(e&&e.message)||"No se pudo iniciar sesión.";msg.className="login-msg err";}
  $("#l-go").disabled=false;
}
async function doForgot(){
  const email=$("#l-email").value.trim(),msg=$("#l-msg");msg.className="login-msg";
  if(!email){msg.textContent="Escribe tu correo arriba y vuelve a tocar aquí.";msg.className="login-msg err";return;}
  try{const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split("#")[0]});if(error)throw error;msg.textContent="Te enviamos un correo para recuperar tu contraseña.";msg.className="login-msg ok";}
  catch(e){msg.textContent=(e&&e.message)||"No se pudo enviar.";msg.className="login-msg err";}
}
let _recovery=false;
function showRecovery(){
  _recovery=true;$("#loginScreen").hidden=false;
  $("#lsub").textContent="Escribe tu nueva contraseña";
  const ef=document.querySelector("#l-email").closest(".field");if(ef)ef.style.display="none";
  const pf=document.querySelector("#l-pass").closest(".field");if(pf)pf.querySelector("label").textContent="Nueva contraseña";
  $("#l-pass").value="";$("#l-go").textContent="Guardar contraseña";
  $("#l-switch").innerHTML="";$("#l-forgot-wrap").hidden=true;
  const msg=$("#l-msg");msg.textContent="";msg.className="login-msg";
}
async function doLoginOrSave(){
  if(_recovery){
    const p=$("#l-pass").value,msg=$("#l-msg");msg.className="login-msg";
    if(p.length<6){msg.textContent="La contraseña debe tener al menos 6 caracteres.";msg.className="login-msg err";return;}
    $("#l-go").disabled=true;
    try{const{error}=await sb.auth.updateUser({password:p});if(error)throw error;_recovery=false;msg.textContent="¡Listo! Entrando…";msg.className="login-msg ok";setTimeout(()=>location.replace(location.pathname),800);}
    catch(e){msg.textContent=(e&&e.message)||"No se pudo.";msg.className="login-msg err";$("#l-go").disabled=false;}
    return;
  }
  return doLogin();
}
async function boot(){
  $("#l-go").onclick=doLoginOrSave;
  $("#l-forgot").onclick=doForgot;
  $("#l-pass").addEventListener("keydown",e=>{if(e.key==="Enter")doLoginOrSave();});
  setLoginMode("in");
  const isRecovery=location.hash.includes("type=recovery");
  let session=null;
  try{session=(await sb.auth.getSession()).data.session;}catch(e){console.error(e);}
  if(isRecovery)showRecovery();
  else if(session&&session.user){await loadAll(session.user);$("#loginScreen").hidden=true;render();}
  sb.auth.onAuthStateChange(async(_e,s)=>{
    if(_e==="PASSWORD_RECOVERY"){showRecovery();return;}
    if(_recovery)return;
    if(s&&s.user){if(S.currentUserId!==s.user.id){await loadAll(s.user);}$("#loginScreen").hidden=true;render();}
    else{S.currentUserId=null;$("#loginScreen").hidden=false;}
  });
}
boot();
</script>
